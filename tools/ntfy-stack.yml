# ntfy on the NAS - where Wasabi sends its alerts, and where the ntfy app
# on the phone picks them up (over Tailscale: http://bytebandit:8090).
# Portainer: Stacks > Add stack > Web editor, name: ntfy.
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: ["serve"]
    user: "1026:100"
    environment:
      - TZ=Europe/Stockholm
      - NTFY_BASE_URL=http://bytebandit:8090
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=72h
      # Not ntfy's usual :80 - as the NAS user (not root) it may not open
      # a port under 1024: "listen tcp :80: bind: permission denied".
      - NTFY_LISTEN_HTTP=:8090
    ports:
      - "8090:8090"
    volumes:
      - /volume2/docker/ntfy/cache:/var/cache/ntfy
